<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Panel — Aalvi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a; --bg-surface: #111; --bg-card: #161616; --border: #1e1e1e;
      --border-light: #2a2a2a; --text-primary: #e5e5e5; --text-secondary: #8a8a8a;
      --text-muted: #555; --accent: #a78bfa; --accent-hover: #c4b5fd;
      --accent-glow: rgba(167,139,250,0.12); --danger: #f87171;
      --font-sans: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
      --radius: 8px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); line-height:1.6; }
    a { color: var(--accent); text-decoration: none; }

    /* Auth Gate */
    .auth-gate {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; gap: 16px;
    }
    .auth-gate h2 { font-size: 1.5rem; font-weight: 600; }
    .auth-gate input {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 16px; color: var(--text-primary); font-size: 0.9rem; width: 280px;
      font-family: var(--font-sans);
    }
    .auth-gate input:focus { outline: none; border-color: var(--accent); }
    .auth-error { color: var(--danger); font-size: 0.82rem; min-height: 20px; }

    /* Layout */
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px; background: var(--bg-surface); border-right: 1px solid var(--border);
      padding: 20px 0; position: fixed; top: 0; bottom: 0; overflow-y: auto;
    }
    .sidebar-header {
      padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
    }
    .sidebar-header h2 { font-size: 1rem; font-weight: 600; }
    .sidebar-header p { font-size: 0.72rem; color: var(--text-muted); }
    .admin-tab {
      display: block; width: 100%; text-align: left; background: none; border: none;
      color: var(--text-secondary); font-family: var(--font-sans); font-size: 0.85rem;
      padding: 10px 20px; cursor: pointer; transition: all 150ms;
    }
    .admin-tab:hover { color: var(--text-primary); background: var(--accent-glow); }
    .admin-tab.active { color: var(--accent); background: var(--accent-glow); border-right: 2px solid var(--accent); }
    .sidebar-actions { padding: 16px 20px; border-top: 1px solid var(--border); margin-top: auto; display:flex; flex-direction:column; gap:8px; position:absolute; bottom:0; left:0; right:0; }

    .content-area { margin-left: 220px; padding: 40px; flex: 1; max-width: 800px; }

    /* Form elements */
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .field input, .field textarea, .field select {
      width: 100%; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px; color: var(--text-primary);
      font-family: var(--font-sans); font-size: 0.88rem; transition: border 150ms;
    }
    .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
    .field textarea { resize: vertical; }

    /* Buttons */
    .admin-btn {
      background: var(--accent); color: #0a0a0a; border: none; border-radius: var(--radius);
      padding: 10px 20px; font-family: var(--font-sans); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 150ms;
    }
    .admin-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .admin-btn-sm {
      background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(167,139,250,0.2);
      border-radius: 6px; padding: 5px 12px; font-size: 0.75rem; cursor: pointer;
      font-family: var(--font-sans); transition: all 150ms;
    }
    .admin-btn-sm:hover { background: rgba(167,139,250,0.2); }
    .admin-btn-sm.danger { color: var(--danger); border-color: rgba(248,113,113,0.2); background: rgba(248,113,113,0.08); }
    .admin-btn-sm.danger:hover { background: rgba(248,113,113,0.15); }
    .admin-btn-xs { background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.85rem; padding:0 4px; }
    .admin-btn-outline {
      background: none; color: var(--text-secondary); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 16px; font-family: var(--font-sans);
      font-size: 0.82rem; cursor: pointer; transition: all 150ms; width:100%;
    }
    .admin-btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* Cards */
    .admin-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px;
    }
    .admin-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .admin-card-sub { font-size: 0.82rem; color: var(--text-secondary); }
    .admin-card small { font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); }

    .admin-list { list-style:none; padding:8px 0; }
    .admin-list li { font-size:0.85rem; padding:4px 0; display:flex; align-items:center; gap:8px; color:var(--text-secondary); }

    .add-form {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; margin-top: 20px;
    }
    .add-form h4 { font-size: 0.9rem; margin-bottom: 16px; color: var(--text-primary); }

    .inline-add { display:flex; gap:8px; align-items:center; margin-top:8px; }
    .inline-add input { flex:1; background:var(--bg-surface); border:1px solid var(--border); border-radius:6px; padding:6px 10px; color:var(--text-primary); font-size:0.82rem; font-family:var(--font-sans); }
    .inline-add input:focus { outline:none; border-color:var(--accent); }

    h3 { font-size:1.2rem; font-weight:600; margin-bottom:16px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px; background: var(--bg-card);
      border: 1px solid var(--accent); border-radius: var(--radius); padding: 12px 20px;
      font-size: 0.85rem; color: var(--accent); transform: translateY(80px); opacity: 0;
      transition: all 300ms cubic-bezier(0.4,0,0.2,1); z-index: 9999; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { width: 100%; position: static; border-right: none; border-bottom: 1px solid var(--border); display:flex; flex-wrap:wrap; padding:12px; }
      .sidebar-header { padding: 0 12px 12px; width: 100%; }
      .admin-tab { width:auto; padding: 8px 14px; font-size: 0.78rem; }
      .sidebar-actions { position:static; flex-direction:row; }
      .admin-layout { flex-direction: column; }
      .content-area { margin-left: 0; padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- Auth Gate -->
  <div id="auth-gate" class="auth-gate">
    <h2>Admin Panel</h2>
    <p style="color:#555;font-size:0.85rem">Enter the admin password to continue</p>
    <input type="password" id="admin-password" placeholder="Password" onkeydown="if(event.key==='Enter')adminLogin()">
    <button class="admin-btn" onclick="adminLogin()">Enter</button>
    <div id="auth-error" class="auth-error"></div>
  </div>

  <!-- Admin Panel -->
  <div id="admin-panel" class="admin-layout" style="display:none">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>aalvi<span style="color:var(--accent)">.</span> admin</h2>
        <p>Content Management</p>
      </div>
      <button class="admin-tab active" data-tab="profile">Profile</button>
      <button class="admin-tab" data-tab="projects">Projects</button>
      <button class="admin-tab" data-tab="courses">Courses</button>
      <button class="admin-tab" data-tab="course-projects">Course Projects</button>
      <button class="admin-tab" data-tab="research">Research</button>
      <button class="admin-tab" data-tab="coding">Coding</button>
      <button class="admin-tab" data-tab="experience">Experience</button>
      <button class="admin-tab" data-tab="blog">Blog</button>
      <button class="admin-tab" data-tab="tools">Tools</button>
      <div class="sidebar-actions">
        <button class="admin-btn-outline" onclick="exportData()">↓ Export JSON</button>
        <button class="admin-btn-outline" onclick="importData()">↑ Import JSON</button>
      </div>
    </aside>
    <div class="content-area" id="tab-content">
      <p style="color:#555">Loading...</p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/admin.js"></script>
</body>
</html>
